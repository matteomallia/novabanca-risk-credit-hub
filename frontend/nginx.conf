server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Routing delle pagine statiche React della Dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blocco esplicito per evitare il ciclo di re-direction 500
    location = /index.html {
        internal;
    }

    # 2. Reverse Proxy per l'Orchestratore Backend Node.js
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Reverse Proxy per i Grafici PNG generati dal Data Agent Python
    location /static/ {
        proxy_pass http://data_agent:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}